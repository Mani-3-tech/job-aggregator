<!DOCTYPE html>
<html>
<head>
    <title>Live Job Dashboard</title>
    <style>
        body { font-family: Arial; background-color: #f4f6f8; padding: 20px; }
        h1 { text-align: center; }
        .search-box {
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            padding: 8px;
            width: 300px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 60%;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        .company { color: #007bff; font-weight: bold; }
        .location { color: gray; }
        .apply-btn {
            padding:8px 12px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>Live Tech Jobs Dashboard 🚀</h1>

    <div class="search-box">
        <form method="get">
            <input type="text" name="search"
            placeholder="Search by title or company"
            value="{{ request.args.get('search', '') }}">
            <button type="submit">Search</button>
        </form>
    </div>

    {% for job in jobs %}
        <div class="card">
            <div class="company">{{ job.company }}</div>
            <h3>{{ job.title }}</h3>
            <div class="location">{{ job.location }}</div>
            <br>
            <a href="{{ job.link }}" target="_blank">
                <button class="apply-btn">Apply Now</button>
            </a>
        </div>
    {% endfor %}

    {% if not jobs %}
        <p style="text-align:center;">No jobs found.</p>
    {% endif %}

</body>
</html>
